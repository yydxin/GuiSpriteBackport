org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ---- Minecraft / NeoForge ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge 版本，锁定为 21.1.250。
# 这个号不是随手写的：它是你手机里 FCL 已经装着的版本
#   /storage/emulated/0/FCL/.minecraft/libraries/net/neoforged/neoforge/21.1.250/
# 换别的号时，用下面任一方式确认它真的存在：
#   1) 浏览器打开 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
#      在 <versions> 里搜 "21.1."
#   2) 看本机 .minecraft/libraries/net/neoforged/neoforge/ 下有哪些目录（装过的版本一定有）
neo_version=21.1.250

loader_version_range=[1,)
# 走官方 Mojang 映射（ModDevGradle 默认就是 official），不要换成 yarn/srg。

# ---- Mod ----
mod_id=guispritebackport
mod_name=GuiSpriteBackport
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.example.guispritebackport
mod_authors=yydxin
mod_description=Backports the 1.21.2+ GUI-sprite based tooltip background/frame to NeoForge 1.21.1 (client side only).
